name: Build and Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Replicate Model Destination (e.g. xirecentxz/wai-real-cn)'
        required: true
        default: 'xirecentxz/wai-real-cn'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Cleaning up disk space on GitHub Actions runner..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token_input: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Download Model Weights from Hugging Face
        run: |
          mkdir -p weights
          echo "Downloading waiREALCN_v50.safetensors (6.6 GB) from Hugging Face CDN..."
          wget -q --show-progress -c -O weights/waiREALCN_v50.safetensors "https://huggingface.co/LyliaEngine/waiREALCN_v50/resolve/main/waiREALCN_v50.safetensors"
          ls -lh weights/

      - name: Push to Replicate
        run: |
          echo "Building Cog container and pushing to Replicate: ${{ github.event.inputs.model_name }}..."
          cog push r8.im/${{ github.event.inputs.model_name }}
